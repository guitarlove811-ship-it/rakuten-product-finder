name: Pinterest Daily Affiliate Pin

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pinterest-daily-affiliate-pin
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post one Rakuten affiliate Pin
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pinterest-daily")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://rakuten-product-finder-api.onrender.com/pinterest-auto/run
